services:
  - type: web
    runtime: docker
    name: darukaa-earth-api
    rootDir: backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-earth-db
          property: connectionString
databases:
  - name: darukaa-earth-db
    plan: basic-256mb
    databaseName: darukaa
    user: darukaa
