services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: darukaa
      POSTGRES_USER: darukaa
      POSTGRES_PASSWORD: darukaa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://darukaa:darukaa@db:5432/darukaa
      JWT_SECRET: change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  postgres_data:
